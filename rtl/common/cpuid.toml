[identity]
vendor = "VibingVibing"                  # leaf 0: EBX, EDX, ECX (12 characters)
family = 0x1A                            # AMD Zen 5/Zen 6 family (base 0Fh + extended 0Bh)
model = 0x00                             # vibe86's own: no AMD model number
stepping = 1
brand = "vibe86 Venice-class microcoded processor"   # leaves 8000_0002h-8000_0004h (<= 48 bytes)
clflush_line = 64                        # CPUID.1:EBX[15:8] x 8 bytes
phys_addr_bits = 52                      # CPUID.8000_0008h:EAX[7:0] (the walk keeps PTE bits 51:12)
lin_addr_bits = 57                       # CPUID.8000_0008h:EAX[15:8] (5-level paging)

# leaf 1 EBX[31:24] (initial APIC ID) and ECX[27] (OSXSAVE = CR4.OSXSAVE) are
# dynamic; leaf 7.0 EAX (max subleaf) and the max leaves are computed.

# Leaves that only hold constants beyond the feature bits.
[[leaf]]
leaf = 0x6
eax = 0x4                                # ARAT is a feature bit below; nothing else

[[leaf]]
leaf = 0x7
sub = 0
eax = 1                                  # subleaves 0..1

# Leaf 0Bh: the x2APIC topology (Intel SDM Vol. 2A CPUID, "Extended
# Topology Enumeration Leaf"; AMD APM Vol. 3 appendix E, Fn0000_000B):
# level 0 SMT (1 thread per core), level 1 core (1 core on the v1 die); EDX
# is the x2APIC ID (filled in by the core). A 2-core die makes level 1's
# EAX 1 and EBX 2.
[[leaf]]
leaf = 0xB
sub = 0
eax = 0
ebx = 1
ecx = 0x100

[[leaf]]
leaf = 0xB
sub = 1
eax = 0
ebx = 1
ecx = 0x201

[[leaf]]
leaf = 0xB
sub = 2
ecx = 2

[[leaf]]
leaf = 0xD                               # XSAVE enumeration: zeros until XSAVE is implemented
sub = 0

[[leaf]]

[[leaf]]

[[leaf]]

[[leaf]]
leaf = 0x8000_001E                       # TOPOEXT ids: extended APIC id 0, core 0, one thread
                                         # per core (EBX[15:8] = 0), node 0, one node

[[leaf]]
leaf = 0x8000_001D                       # TOPOEXT cache properties: subleaf 0 cache type 0,
sub = 0                                  # i.e. no caches (v1 has none)
leaf = 0x8000_0021

# Not yet positioned (AMD-defined; check the APM): 8000_0007 EBX
# OVERFLOW_RECOV/SUCCOR, 8000_0008 EBX XSAVEERPTR/WBNOINVD/IBPB/IBRS/STIBP/
# STIBP_ALWAYS_ON/AMD_SSBD/AMD_PSFD, 8000_0021 EAX NO_NESTED_DATA_BP/
# FS_GS_BASE_NS/LFENCE_ALWAYS_SERIALIZING/NULL_SEL_CLR_BASE/AUTO_IBRS/
# PREFETCHI/SBPB/IBPB_BRTYPE/SRSO_USER_KERNEL_NO, 8000_0022 EAX PERFMON_V2,
# leaf 0Dh XSAVEOPT/XSAVEC/XGETBV1/XSAVES, the SVM leaf 8000_000Ah.
