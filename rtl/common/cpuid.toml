# vibe86 CPUID: the processor's identity and its feature bits.
#
# tools/gen/rtlgen.py turns this into rtl/common's vibe86_cpuid_pkg (in the
# build tree, not in git): per core version, a function cpuid_<version>(leaf,
# subleaf) returning {EDX, ECX, EBX, EAX}, and the reset signature (EDX after
# reset = CPUID.1:EAX). The core ORs in the fields that depend on state
# (marked 'dynamic' below).
#
# The feature baseline is the target ISA (docs/decisions.md D-007): AMD EPYC
# "Venice" (Zen 6) as QEMU's EPYC-Venice CPU model defines it (qemu-devel,
# "[PATCH v2 0/4] Add Support for AMD EPYC Zen 6 CPU Model", 25 Aug 2026:
# EPYC-Turin plus AVX512-FP16, AVX-IFMA, AVX-NE-CONVERT, AVX-VNNI-INT8,
# AVX512-BMM, ERAPS, TSC_ADJUST and CET_SS). Bit positions: Intel SDM Vol. 2A,
# CPUID (leaves 1, 6, 7, 0Dh) and AMD64 Architecture Programmer's Manual
# Vol. 3 (pub. 24594), appendix E (leaves 8000_00xxh). 'verify' marks
# AMD-defined positions taken from QEMU's target/i386/cpu.h.
#
# A feature is reported by the core versions from 'since' on; one without
# 'since' is in the target but not implemented yet (CPUID reports 0), so
# software never sees a feature the core would #UD on. When every feature
# has a 'since', CPUID reports the full Venice baseline.

# Feature bits: leaf, subleaf (default 0), register, bit, name, since.
feature = [
  { leaf = 0x1, reg = "ecx", bit = 0,  name = "SSE3" },
  { leaf = 0x1, reg = "ecx", bit = 1,  name = "PCLMULQDQ" },
