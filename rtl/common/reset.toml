# vibe86 architectural state after RESET# (power-up and warm reset).
#
# Intel SDM Vol. 3A, 10.1.1 "Processor State After Reset" (Table 10-1) and
# AMD64 Architecture Programmer's Manual Vol. 2 (pub. 24593), 14.1.3
# "Processor Initialization State" (Table 14-1). Where the two differ the
# value follows the AMD table (the Venice target) and the note says so.
#
# tools/gen/rtlgen.py turns this into vibe86_reset_pkg (build tree): a
# localparam RESET_<NAME> per register and RESET_SEG[8] for the segment
# registers in the order ES CS SS DS FS GS LDTR TR. Values given as a string
# name another description: "cpuid.signature" is CPUID.1:EAX;
# "msr.<NAME>" is that MSR's default in platform.toml.

[gpr]
# all others 0
RDX = "cpuid.signature"                  # EDX: family/model/stepping

[registers]
RIP = 0xFFF0
RFLAGS = 0x2                             # bit 1 reads as 1
CR0 = 0x6000_0010                        # CD, NW, ET
CR2 = 0
CR3 = 0
CR4 = 0
CR8 = 0
DR0 = 0
DR1 = 0
DR2 = 0
DR3 = 0
DR6 = 0xFFFF_0FF0
DR7 = 0x400
GDTR_BASE = 0
GDTR_LIMIT = 0xFFFF
IDTR_BASE = 0
IDTR_LIMIT = 0xFFFF
XCR0 = 0x1                               # x87 state always enabled
MXCSR = 0x1F80                           # all exceptions masked, round to nearest
FCW = 0x0040                             # power-up value (both tables); FNINIT sets 037Fh
FSW = 0
FTW = 0x5555                             # all registers tagged zero (both tables); FNINIT sets FFFFh
EFER = "msr.IA32_EFER"
PAT = "msr.IA32_PAT"
APIC_BASE = "msr.IA32_APIC_BASE"         # BSP; an AP has bit 8 (BSP) clear
TSC_AUX = "msr.IA32_TSC_AUX"
STAR = 0
LSTAR = 0
CSTAR = 0
FMASK = 0
KERNEL_GS_BASE = 0
SYSENTER_CS = 0
SYSENTER_ESP = 0
SYSENTER_EIP = 0
SMBASE = 0x3_0000                        # SMRAM save area at SMBASE + FE00h (AMD APM Vol. 2 10.2.3)
SMM = 0                                  # not in system management mode

# Segment registers: selector, base, limit, attributes {G, D/B, L, AVL, P,
# DPL, S, Type} (bits 11:0, the descriptor cache's layout).
[segments]
ES   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x93 }   # present, data r/w, accessed
CS   = { sel = 0xF000, base = 0xFFFF_0000, limit = 0xFFFF, attr = 0x9B }   # present, code x/r, accessed
SS   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x93 }
DS   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x93 }
FS   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x93 }
GS   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x93 }
LDTR = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x82 }   # present, LDT
TR   = { sel = 0,      base = 0,           limit = 0xFFFF, attr = 0x8B }   # present, busy 32-bit TSS
