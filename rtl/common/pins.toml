# vibe86 die interface: the pins of a processor die (one or more cores) that
# face the rest of the package and the system. Every core version
# (rtl/<version>) has exactly these ports, so vsim and any other harness
# drive all versions the same way (docs/die-interface.md, D-014).
#
# tools/gen/rtlgen.py generates from this (build tree, not git):
#   vibe86_die_pkg.sv     widths as localparams (DIE_<NAME>_W)
#   vibe86_die_ports.svh  the module port list of each version's die top
#   vibe86_die.h          the C++ pin struct for vsim (sim/cpu.h) and
#                         die_in()/die_out() copying it to/from a Verilated
#                         die model
#
# Fields: dir (in/out), width, c (the C++ member: 'x' for a die-wide pin,
# 'ev[].vector' for a per-core array of structs, 'ddr[#].ca' for an
# instanced group), route (an input that goes to one core: the C++ member
# naming that core), instances (copies of the pin: '{i}' in the name takes
# each value), desc. The pins themselves: docs/die-interface.md (D-014).
#
# The package (D-019, docs/package.md): group names the pin's ball group in
# package.toml; sim = true marks a simulation observation port (no ball).
# Reserved pins have balls but no logic yet: implemented lists the
# instances that have it (the rest are reserved), reserved = true a whole
# pin; a reserved output is driven at idle (vibe86_die_reserved.svh).

[structs]                                 # C++ structs: member -> type name
ev = "event"                              # per core
rt = "retire"                             # per core
ddr = "ddr5_subchannel"                   # per DDR5 subchannel (instances)
ddrch = "ddr5_channel"                    # per DDR5 channel (instances)
spd = "spd_bus"                           # per SPD bus (instances)
xsl = "xsl_link"                          # per inter-socket link (instances)

[[pin]]
name = "clk"
group = "clock_reset"
dir = "in"
width = 1
desc = "core clock"

[[pin]]
name = "rst_n"
group = "clock_reset"
dir = "in"
width = 1
desc = "RESET# (active low): cold and warm reset"

[[pin]]
name = "meminit_fast"
group = "test"
dir = "in"
width = 1
desc = "strap (simulation): JEDEC init waits scaled down by 1024"

# --- DDR5: 8 channels x 2 subchannels (channels 0-1 implemented), the DRAMs' host interface
#     (Micron DDR5 core data sheet Table 140; docs/die-interface.md)
[[pin]]
name = "ddr{i}_cs_n"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].cs_n"
group = "ddr5"
idle = "'1"
dir = "out"
width = 4
desc = "CS_n: DIMM 0 rank 0/1, DIMM 1 rank 0/1 (active low)"

[[pin]]
name = "ddr{i}_ca"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].ca"
group = "ddr5"
idle = "'0"
dir = "out"
width = 14
desc = "CA[13:0], sampled on the CK rising edge"

[[pin]]
name = "ddr{i}_dq_o"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].dq_o"
group = "ddr5"
idle = "'0"
dir = "out"
width = 80
desc = "write data: beat 0 in 39:0, beat 1 in 79:40 (DQ[31:0] + CB[7:0] each)"

[[pin]]
name = "ddr{i}_dq_oe"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].dq_oe"
group = "ddr5"
idle = "1'b0"
dir = "out"
width = 1
desc = "the die drives DQ (writes)"

[[pin]]
name = "ddr{i}_dqs_o"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].dqs_o"
group = "ddr5"
idle = "'0"
dir = "out"
width = 2
desc = "write strobe DQS_t, one bit per beat"

[[pin]]
name = "ddr{i}_dq_i"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].dq_i"
group = "ddr5"
dir = "in"
width = 80
desc = "read data, as dq_o"

[[pin]]
name = "ddr{i}_dqs_i"
instances = ["0a", "0b", "1a", "1b", "2a", "2b", "3a", "3b", "4a", "4b", "5a", "5b", "6a", "6b", "7a", "7b"]
implemented = ["0a", "0b", "1a", "1b"]
c = "ddr[#].dqs_i"
group = "ddr5"
dir = "in"
width = 2
desc = "read strobe from the DRAMs, one bit per beat"

[[pin]]
name = "ddr{i}_reset_n"
instances = ["0", "1", "2", "3", "4", "5", "6", "7"]
implemented = ["0", "1"]
c = "ddrch[#].reset_n"
group = "ddr5"
idle = "1'b0"
dir = "out"
width = 1
desc = "the channel's DRAM RESET_n"

[[pin]]
name = "ddr{i}_alert_n"
instances = ["0", "1", "2", "3", "4", "5", "6", "7"]
implemented = ["0", "1"]
c = "ddrch[#].alert_n"
group = "ddr5"
dir = "in"
width = 1
desc = "ALERT_n (wired-OR across the channel)"

# --- SPD buses (SMBus / I3C Basic, open drain): bus 0 channels 0-3, bus 1
#     channels 4-7 (reserved)
[[pin]]
name = "spd{i}_scl_o"
instances = ["0", "1"]
implemented = ["0"]
c = "spd[#].scl_o"
group = "spd"
idle = "1'b1"
dir = "out"
width = 1
desc = "0 pulls SCL low"

[[pin]]
name = "spd{i}_sda_o"
instances = ["0", "1"]
implemented = ["0"]
c = "spd[#].sda_o"
group = "spd"
idle = "1'b1"
dir = "out"
width = 1
desc = "0 pulls SDA low"

[[pin]]
name = "spd{i}_scl_i"
instances = ["0", "1"]
implemented = ["0"]
c = "spd[#].scl_i"
group = "spd"
dir = "in"
width = 1
desc = "the SCL level"

[[pin]]
name = "spd{i}_sda_i"
instances = ["0", "1"]
implemented = ["0"]
c = "spd[#].sda_i"
group = "spd"
dir = "in"
width = 1
desc = "the SDA level"

# --- the I/O link: 64-bit flits, valid/ready, both directions
[[pin]]
name = "iol_tx_valid"
group = "syslink"
dir = "out"
width = 1
desc = "die -> I/O die: a flit is offered"

[[pin]]
name = "iol_tx_flit"
group = "syslink"
dir = "out"
width = 64
desc = "die -> I/O die flit"

[[pin]]
name = "iol_tx_ready"
group = "syslink"
dir = "in"
width = 1
desc = "the I/O die takes the flit"

[[pin]]
name = "iol_rx_valid"
group = "syslink"
dir = "in"
width = 1
desc = "I/O die -> die: a flit is offered"

[[pin]]
name = "iol_rx_flit"
group = "syslink"
dir = "in"
width = 64
desc = "I/O die -> die flit"

[[pin]]
name = "iol_rx_ready"
group = "syslink"
dir = "out"
width = 1
desc = "the die takes the flit"

# --- inter-socket links (reserved, D-019): x16 each, at the flit level like
#     the system link
[[pin]]
name = "xsl{i}_tx_valid"
instances = ["0", "1"]
implemented = []
c = "xsl[#].tx_valid"
group = "xsl"
idle = "1'b0"
dir = "out"
width = 1
desc = "a flit is offered to the other socket"

[[pin]]
name = "xsl{i}_tx_flit"
instances = ["0", "1"]
implemented = []
c = "xsl[#].tx_flit"
group = "xsl"
idle = "'0"
dir = "out"
width = 64
desc = "the flit"

[[pin]]
name = "xsl{i}_tx_ready"
instances = ["0", "1"]
implemented = []
c = "xsl[#].tx_ready"
group = "xsl"
dir = "in"
width = 1
desc = "the other socket takes it"

[[pin]]
name = "xsl{i}_rx_valid"
instances = ["0", "1"]
implemented = []
c = "xsl[#].rx_valid"
group = "xsl"
dir = "in"
width = 1
desc = "the other socket offers a flit"

[[pin]]
name = "xsl{i}_rx_flit"
instances = ["0", "1"]
implemented = []
c = "xsl[#].rx_flit"
group = "xsl"
dir = "in"
width = 64
desc = "its flit"

[[pin]]
name = "xsl{i}_rx_ready"
instances = ["0", "1"]
implemented = []
c = "xsl[#].rx_ready"
group = "xsl"
idle = "1'b0"
dir = "out"
width = 1
desc = "this socket takes it"

# --- JTAG (IEEE 1149.1)
[[pin]]
name = "tck"
group = "jtag"
dir = "in"
width = 1
desc = "JTAG test clock"

[[pin]]
name = "tms"
group = "jtag"
dir = "in"
width = 1
desc = "JTAG test mode select"

[[pin]]
name = "tdi"
group = "jtag"
dir = "in"
width = 1
desc = "JTAG test data in"

[[pin]]
name = "trst_n"
group = "jtag"
dir = "in"
width = 1
desc = "JTAG test reset (active low)"

[[pin]]
name = "tdo"
group = "jtag"
dir = "out"
width = 1
desc = "JTAG test data out"

# --- interrupts and machine checks from the I/O die (sideband)
[[pin]]
name = "intr_valid"
dir = "in"
width = 1
route = "intr_core"
desc = "the 8259's INTR (level) with its vector: the local APICs' LINT0 (ExtINT, virtual wire; D-017)"

[[pin]]
name = "intr_vector"
dir = "in"
width = 8
desc = "the interrupt's vector"

[[pin]]
name = "intr_ack"
dir = "out"
width = 1
c = "intr_ack[]"
desc = "INTA: a core took the 8259's interrupt through LINT0 (one pulse)"

[[pin]]
name = "nmi"
dir = "in"
width = 1
route = "nmi_core"
desc = "the NMI pin (one-cycle pulse): the local APICs' LINT1"

[[pin]]
name = "smi"
dir = "in"
width = 1
route = "smi_core"
desc = "SMI# (one-cycle pulse): enter system management mode"

[[pin]]
name = "mce_valid"
dir = "in"
width = 1
route = "mce_core"
desc = "a machine check (one-cycle pulse)"

[[pin]]
name = "mce_type"
dir = "in"
width = 2
desc = "1 corrected, 2 uncorrected"

[[pin]]
name = "mce_addr"
dir = "in"
width = 64
desc = "the machine check's physical address"

# --- simulation observation (no balls, D-019): retirement and events, per core
