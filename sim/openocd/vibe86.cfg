# OpenOCD configuration for vsim's JTAG probe (docs/jtag.md):
#   vsim -n -D 9824 ... &
#   openocd -f sim/openocd/vibe86.cfg
# (OpenOCD 0.12 syntax; 0.11 and older spell the two remote_bitbang
# commands remote_bitbang_host / remote_bitbang_port.)

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824
transport select jtag
adapter speed 1000

# IEEE 1149.1: IR length 5, Capture-IR 00001b, IDCODE from rtl/common/platform.toml
jtag newtap vibe86 die -irlen 5 -ircapture 0x01 -irmask 0x03 -expected-id 0x10b86001
init

# The debug module (docs/jtag.md). Data registers shift LSB first; drscan
# fields go in order from bit 0, 32 bits per field here.
proc vibe86_status {} {
	irscan vibe86.die 0x10
	return [drscan vibe86.die 32 0]
}
proc vibe86_ctl {bits} {
	irscan vibe86.die 0x10
	drscan vibe86.die 32 $bits
}
proc vibe86_halt {}   { vibe86_ctl 0x1 }
proc vibe86_resume {} { vibe86_ctl 0x2 }
proc vibe86_step {}   { vibe86_ctl 0x4 }
# read core register SEL (0-15 GPRs, 16 RIP, 17 RFLAGS, 0x80+n special n)
# while halted: the first scan asks, the second returns {lo hi}
proc vibe86_reg {sel} {
	irscan vibe86.die 0x11
	drscan vibe86.die 32 0 32 0 8 $sel 1 0
	vibe86_status
	return [drscan vibe86.die 32 0 32 0 8 $sel 1 0]
}
# system bus: 8-byte read at a physical address
proc vibe86_read64 {addr_lo addr_hi} {
	irscan vibe86.die 0x12
	drscan vibe86.die 32 $addr_lo 32 $addr_hi 3 3
	irscan vibe86.die 0x13
	drscan vibe86.die 32 0 32 0 2 1
	vibe86_status
	return [drscan vibe86.die 32 0 32 0 2 0]
}
